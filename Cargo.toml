[workspace]
resolver = "3"
members = ["crates/procgen_rng", "crates/armory", "crates/fb_items", "crates/fb_body", "crates/fb_creatures", "crates/fb_level", "game"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
rust-version = "1.97.1"

[workspace.dependencies]
bevy = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"
procgen_rng = { path = "crates/procgen_rng" }
armory = { path = "crates/armory" }
fb_items = { path = "crates/fb_items" }
fb_body = { path = "crates/fb_body" }
fb_level = { path = "crates/fb_level" }
fb_creatures = { path = "crates/fb_creatures" }

# Bevy is slow in debug; optimise dependencies, keep our code debuggable.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# Optimize generator and procedural crates in test builds: their mesh and body generation
# is compute-intensive and runs for every test. The game binary stays at opt-level = 1
# to keep recompile times short during development.
[profile.dev.package.armory]
opt-level = 3
[profile.dev.package.fb_body]
opt-level = 3
[profile.dev.package.fb_items]
opt-level = 3
[profile.dev.package.fb_creatures]
opt-level = 3
[profile.dev.package.fb_level]
opt-level = 3
[profile.dev.package.procgen_rng]
opt-level = 3
