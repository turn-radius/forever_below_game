[workspace]
resolver = "3"
members = ["crates/procgen_rng", "crates/procgen_grammar", "crates/fb_faction", "crates/armory", "crates/fb_items", "crates/fb_body", "crates/fb_creatures", "crates/fb_level", "crates/fb_character", "game"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
rust-version = "1.97.1"

# One lint table for every crate (each crate opts in with `[lints] workspace = true`).
# `cargo clippy --workspace --all-targets -- -D warnings` runs in CI. Bevy systems take many
# parameters and long query types, so those two allows stay on the single systems that need them.
# `clippy::float_cmp` is left off: it flags over a hundred exact comparisons the tests rely on.
[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# Only the features the game uses. They are the `3d`, `ui` and `audio` collections written out
# (each adds the window, input, assets, PNG, text and the default font) minus what the game never
# touches: `2d` sprites, glTF, scenes, gamepads (`bevy_gilrs`), mesh and sprite picking (UI picking
# stays, and `Pickable` with it), custom cursors, `sysinfo_plugin`, UI widgets and WebGL.
# The 2D cameras that carry the UI on the title, level and lab views live in the core pipeline.
bevy = { version = "0.20", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "bevy_clipboard",
    "default_font",
    "x11",
    "wayland",
    "3d_api",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_anti_alias",
    "bevy_post_process",
    "bevy_gizmos_render",
    "ui_api",
    "bevy_ui_render",
    "audio",
    "bevy_picking",
    "ui_picking",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"
procgen_rng = { path = "crates/procgen_rng" }
procgen_grammar = { path = "crates/procgen_grammar" }
armory = { path = "crates/armory" }
fb_items = { path = "crates/fb_items" }
fb_body = { path = "crates/fb_body" }
fb_faction = { path = "crates/fb_faction" }
fb_level = { path = "crates/fb_level" }
fb_creatures = { path = "crates/fb_creatures" }
fb_character = { path = "crates/fb_character" }

# Bevy is slow in debug; optimise dependencies, keep our code debuggable.
# Debug info is most of a build's size: dependencies build without it, and our crates keep
# line tables, so backtraces still name files and lines.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3
debug = false

# Optimize generator and procedural crates in test builds: their mesh and body generation
# is compute-intensive and runs for every test. The game binary stays at opt-level = 1
# to keep recompile times short during development.
[profile.dev.package.armory]
opt-level = 3
[profile.dev.package.fb_body]
opt-level = 3
[profile.dev.package.fb_items]
opt-level = 3
[profile.dev.package.fb_creatures]
opt-level = 3
[profile.dev.package.fb_level]
opt-level = 3
[profile.dev.package.procgen_rng]
opt-level = 3
[profile.dev.package.fb_character]
opt-level = 3

# Release builds ship with thin LTO and one codegen unit; they take longer to build for a faster game.
[profile.release]
lto = "thin"
codegen-units = 1

# Release speed with line tables kept and symbols unstripped, for profilers (see docs/rendering.md):
# `cargo build --profile profiling -p forever_below`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
