[workspace]
resolver = "3"
members = ["crates/procgen_rng", "crates/armory", "crates/fb_items", "crates/fb_body", "game"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
rust-version = "1.97.1"

[workspace.dependencies]
bevy = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
procgen_rng = { path = "crates/procgen_rng" }
armory = { path = "crates/armory" }
fb_items = { path = "crates/fb_items" }
fb_body = { path = "crates/fb_body" }

# Bevy is slow in debug; optimise dependencies, keep our code debuggable.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
