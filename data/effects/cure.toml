# Cure: a sickly green haze is drawn out of the body and swirls around the view, then a brief white
# flash scatters it into sparks. Played at the delver when a Cure prayer lifts something. See
# docs/effects.md.
name = "cure"
length = 1.6
lasts = false
bloom_in = 0.2
sputter_out = 0.5

[light]
at = "caster"
peak = 0.4
reach = 90.0
colour = [0.8, 1.0, 0.8]
follows = { flash = { at_s = 1.0 } }

[[emitters]]
name = "haze"
card = "wisp"
size = [{ at = 0.0, size = 3.0 }, { at = 0.5, size = 6.0 }, { at = 1.0, size = 8.0 }]
colour = [{ at = 0.0, rgb = [0.65, 0.85, 0.2] }, { at = 1.0, rgb = [0.4, 0.7, 0.25] }]

[emitters.spawn]
at = "caster"
nudge = [0.0, -4.0, 14.0]

[emitters.timing]
kind = "stream"
count = 30
life = 1.0
start = 0.0
end = 1.0

[emitters.motion]
kind = "orbit"
speed = 3.0
orbit_radius = 9.0
orbits = 1.2

[[emitters]]
name = "motes"
