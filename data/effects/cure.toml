# Cure: three strands of sickly yellow-green motes are drawn out of the delver, winding up a
# body-wide column the same way Heal's do, a pillar of pale light washes up past them, then a brief white flash scatters it into sparks. Played at the delver when a Cure
# prayer lifts something. See docs/effects.md.
name = "cure"
length = 1.9
lasts = false
bloom_in = 0.2
