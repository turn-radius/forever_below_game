# Cure: three strands of sickly yellow-green motes are drawn out of the delver, winding up a
# body-wide column the same way Heal's do, then a brief white flash scatters it into sparks. Played at the delver when a Cure
# prayer lifts something. See docs/effects.md.
name = "cure"
length = 1.9
lasts = false
bloom_in = 0.2
sputter_out = 0.5

[light]
at = "caster"
peak = 0.4
reach = 90.0
colour = [0.8, 1.0, 0.8]
follows = { flash = { at_s = 1.3 } }

[[emitters]]
name = "motes"
card = "mote"
size = [{ at = 0.0, size = 0.6 }, { at = 0.5, size = 0.9 }, { at = 1.0, size = 0.4 }]
colour = [{ at = 0.0, rgb = [0.95, 1.0, 0.35] }, { at = 1.0, rgb = [0.75, 1.0, 0.45] }]

[emitters.spawn]
at = "caster"
nudge = [0.0, -15.0, 0.0]

[emitters.timing]
kind = "stream"
count = 300
life = 1.2
start = 0.0
end = 1.0

[emitters.motion]
kind = "helix"
speed = 17.0
scatter = 0.3
orbit_radius = 3.6
orbits = -1.5
strands = 3

