# Heal: warm gold and soft green motes spiral upward around the view and draw in, with a soft warm
# glow that swells and fades. Played at the delver when a Heal prayer mends something. See
# docs/effects.md.
name = "heal"
length = 1.6
lasts = false
bloom_in = 0.5
sputter_out = 0.7

[light]
at = "caster"
peak = 0.3
reach = 90.0
colour = [1.0, 0.88, 0.55]
follows = "envelope"

[[emitters]]
name = "spiral"
card = "mote"
size = [{ at = 0.0, size = 1.0 }, { at = 0.4, size = 2.6 }, { at = 1.0, size = 0.8 }]
colour = [{ at = 0.0, rgb = [1.0, 0.85, 0.45] }, { at = 0.6, rgb = [0.75, 1.0, 0.6] }, { at = 1.0, rgb = [1.0, 0.95, 0.75] }]

[emitters.spawn]
at = "caster"
nudge = [0.0, -4.0, 14.0]

[emitters.timing]
kind = "stream"
count = 70
life = 1.1
start = 0.0
end = 1.5

[emitters.motion]
kind = "orbit"
speed = 7.0
orbit_radius = 10.0
orbits = 1.5

[[emitters]]
name = "gather"
card = "mote"
size = [{ at = 0.0, size = 0.8 }, { at = 0.5, size = 1.8 }, { at = 1.0, size = 0.5 }]
colour = [{ at = 0.0, rgb = [0.7, 1.0, 0.55] }, { at = 1.0, rgb = [1.0, 0.9, 0.55] }]

[emitters.spawn]
shape = "ring"
at = "caster"
spread = 16.0
nudge = [0.0, -8.0, 12.0]

[emitters.timing]
kind = "stream"
count = 40
life = 0.9
start = 0.1
end = 1.5

[emitters.motion]
kind = "rise"
speed = 9.0
scatter = 2.0

[[emitters]]
name = "sparks"
card = "spark"
tail = 0.08
size = [{ at = 0.0, size = 0.6 }, { at = 1.0, size = 0.15 }]
colour = [{ at = 0.0, rgb = [1.0, 0.97, 0.8] }, { at = 1.0, rgb = [1.0, 0.8, 0.4] }]

[emitters.spawn]
at = "caster"
nudge = [0.0, -2.0, 14.0]

[emitters.timing]
kind = "burst"
count = 14
life = 0.9
start = 0.5

[emitters.motion]
kind = "drift"
speed = 5.0
