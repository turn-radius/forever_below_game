# Heal: three strands of warm gold motes (and a few soft green ones) wind up a body-wide column
# around the delver from the feet past the head, trailing short streaks and wisps so the spiral
# reads, under a warm glow that swells and fades. Played at the delver when a Heal prayer mends
# something. A pillar of light washes down over the delver with it. Cure is its sibling. See docs/effects.md.
name = "heal"
length = 1.9
lasts = false
bloom_in = 0.5
sputter_out = 0.7

[light]
at = "caster"
peak = 0.3
reach = 90.0
colour = [1.0, 0.88, 0.55]
follows = "envelope"

[[emitters]]
name = "gold"
card = "mote"
size = [{ at = 0.0, size = 0.5 }, { at = 0.5, size = 0.7 }, { at = 1.0, size = 0.3 }]
colour = [{ at = 0.0, rgb = [1.0, 0.85, 0.4] }, { at = 1.0, rgb = [1.0, 0.97, 0.75] }]

