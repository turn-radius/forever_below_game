# Heal: a swirl of warm gold motes and a few soft green ones winds round the delver and climbs from
# the feet past the head, with soft wisps trailing so the circling reads, under a warm glow that
# swells and fades. Played at the delver when a Heal prayer mends something. Cure is its sibling.
# See docs/effects.md.
name = "heal"
length = 1.9
lasts = false
bloom_in = 0.5
sputter_out = 0.7

[light]
at = "caster"
peak = 0.3
reach = 90.0
colour = [1.0, 0.88, 0.55]
follows = "envelope"

[[emitters]]
name = "gold"
card = "mote"
size = [{ at = 0.0, size = 0.9 }, { at = 0.4, size = 2.0 }, { at = 1.0, size = 0.8 }]
