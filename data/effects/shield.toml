# Shield: while the prayer stands, a faint shimmer of motes circles the view and passes across
# its edges, leaving the middle clear. It blooms in when cast and sputters out near its end.
# Played by the prayer and stopped by it. See docs/effects.md.
name = "shield"
length = 8.0
lasts = true
bloom_in = 1.2
sputter_out = 6.0

[[emitters]]
name = "shimmer"
card = "mote"
size = [{ at = 0.0, size = 0.3 }, { at = 0.5, size = 0.8 }, { at = 1.0, size = 0.3 }]
colour = [{ at = 0.0, rgb = [1.0, 0.9, 0.6] }, { at = 1.0, rgb = [1.0, 0.8, 0.4] }]

[emitters.spawn]
at = "caster"
nudge = [0.0, -1.0, 6.0]

[emitters.timing]
kind = "lasting"
count = 36
life = 8.0

[emitters.motion]
kind = "orbit"
orbit_radius = 9.0
orbits = 1.0
