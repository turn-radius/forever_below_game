<title>Spline Armory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an armorer's specimen plate — anatomy controls listed top-down (gem → pommel) beside a framed, ink-rendered plate. */
:root{
  --bg:#e2e6e4; --panel:#eef1ef; --ink:#1c2326; --muted:#5b676b; --line:#c4ccc9; --accent:#2e6b62; --accent-ink:#ffffff;
  --plate:#dfe3e0; --plate-line:#a7b0ac; --plate-ink:#1c2326; --field:#f8faf9;
  --f-display:'Grenze Gotisch', 'UnifrakturMaguntia', Georgia, serif;
  --f-body:'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131719; --panel:#1a1f22; --ink:#dde3e1; --muted:#8c979a; --line:#2c3337; --accent:#6db1a4; --accent-ink:#0f1413;
  --plate:#c3cac6; --plate-line:#8b9490; --plate-ink:#1c2326; --field:#22282b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131719; --panel:#1a1f22; --ink:#dde3e1; --muted:#8c979a; --line:#2c3337; --accent:#6db1a4; --accent-ink:#0f1413;
  --plate:#c3cac6; --plate-line:#8b9490; --plate-ink:#1c2326; --field:#22282b; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-inline:16px;padding-block:0 16px;box-sizing:border-box;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px 0}
.brand{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.01em;margin:0;text-wrap:balance}
.brand small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-left:10px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:500 14px var(--f-body);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select,input[type=number]{font:14px var(--f-body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=number]{width:84px;font-family:var(--f-mono);font-size:13px}
#famsel{font-weight:700}
.btn{font:500 14px var(--f-body);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:7px 14px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.inline{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

.main{display:grid;grid-template-columns:minmax(290px,350px) minmax(0,1fr);gap:16px;min-height:0}
.panel{display:flex;flex-direction:column;overflow:hidden;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:8px}
#panel{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.grab{display:none}
details{border-bottom:1px solid var(--line)}
details:last-child{border-bottom:0}
summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none}
summary::-webkit-details-marker{display:none}
summary .nm{font-weight:700;font-size:15px;flex:1}
summary .chev{width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details[open] summary .chev{transform:rotate(45deg)}
summary input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0}
details.off summary .nm{color:var(--muted);font-weight:500}
.body{padding:2px 14px 14px;display:grid;gap:9px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.row label{font-size:13.5px;color:var(--ink)}
.row output{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0}
.row select{grid-column:2}
.row input[type=color]{width:44px;height:26px;border:1px solid var(--line);border-radius:4px;background:var(--field);padding:1px}
.row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.sub{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.sub:first-child{border-top:0;margin-top:0;padding-top:4px}

.stage{position:relative;min-height:0;border-radius:8px;background:
  radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.07)), var(--plate);
  border:1px solid var(--line);overflow:hidden}
.stage::before{content:"";position:absolute;inset:10px;border:1px solid var(--plate-line);outline:1px solid var(--plate-line);outline-offset:-5px;pointer-events:none;border-radius:3px}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#view:active{cursor:grabbing}
.caption{position:absolute;left:28px;bottom:24px;max-width:min(60%,420px);color:var(--plate-ink);pointer-events:none}
.caption .nm{font-family:var(--f-display);font-size:24px;font-weight:500;line-height:1.05;text-wrap:balance}
.caption .dim{font-family:var(--f-mono);font-size:12px;margin-top:6px;opacity:.75}
.plateno{position:absolute;top:24px;left:28px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--plate-ink);opacity:.6;pointer-events:none}
.hint{position:absolute;top:24px;right:28px;font-size:12px;color:var(--plate-ink);opacity:.55;pointer-events:none}
.scale{position:absolute;right:28px;bottom:26px;color:var(--plate-ink);font-family:var(--f-mono);font-size:11px;pointer-events:none;text-align:right}
.scale .bar{height:6px;border:1.5px solid var(--plate-ink);border-top:0;margin-top:4px;margin-left:auto;background:linear-gradient(90deg,var(--plate-ink) 50%,transparent 50%)}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--plate-ink)}

/* Phone: the plate fills the screen; header floats on top, controls ride in a translucent bottom sheet. */
@media (max-width:820px){
  html,body{overflow:hidden}
  .app{display:block;height:100%;padding:0}
  .main{display:block}
  header{position:fixed;top:0;left:0;right:0;z-index:3;gap:8px 10px;color:var(--plate-ink);
    padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 14px;
    background:linear-gradient(to bottom,var(--plate) 72%,transparent)}
  .brand{font-size:22px;flex:1}
  #reroll{order:1}
  .tools{order:2}
  .brand small,label.inline{display:none}
  .tools{margin-left:0;gap:6px;width:100%}
  .seg{border-color:var(--plate-line)}
  .seg button{padding:6px 9px;font-size:13px;color:var(--plate-ink)}
  .seg button[aria-pressed="true"]{background:var(--plate-ink);color:var(--plate)}
  .seg{display:none}
  #famsel{display:block;flex:1;min-width:0}
  #preset{flex:1;min-width:0}
  .btn{padding:6px 12px}
  .stage{position:fixed;inset:0;border:0;border-radius:0}
  .stage::before{display:none}
  .panel{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:4;height:46vh;
    background:color-mix(in srgb,var(--panel) 84%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-radius:14px;box-shadow:0 10px 32px rgba(10,20,20,.22);transition:height .22s ease}
  .panel.peek{height:50px}
  .grab{display:flex;align-items:center;gap:10px;flex:none;width:100%;border:0;background:transparent;color:var(--ink);
    font:700 14px var(--f-body);padding:10px 14px 8px;cursor:pointer;border-bottom:1px solid var(--line)}
  .grab .pill{width:36px;height:4px;border-radius:2px;background:var(--muted);opacity:.6;position:absolute;left:50%;top:5px;transform:translateX(-50%)}
  .grab .t{flex:1;text-align:left;padding-top:4px}
  .grab .s{font-weight:500;font-size:13px;color:var(--accent);padding-top:4px}
  details{border-bottom-color:color-mix(in srgb,var(--line) 70%,transparent)}
  .caption{left:16px;bottom:calc(var(--bot,0px) + 12px);max-width:70%}
  .caption .nm{font-size:17px}
  .caption .dim{font-size:11px;margin-top:3px}
  .scale{right:16px;bottom:calc(var(--bot,0px) + 14px)}
  .plateno,.hint{display:none}
}
@media (prefers-reduced-motion: reduce){summary .chev,.panel{transition:none}}
</style>

  <header>

  </div>
</div>

const ARMOR={helm:1,garment:1,shield:1,hands:1,feet:1};
const PAT_ID={none:0,stripes:1,hoops:2,checks:3,tartan:4,lozenge:5,dots:6,chevron:7,quilted:8,mail:9,scales:10,rivets:11,pale:12,fess:13,quarterly:14,bend:15,chevronH:16,paly:17,bendy:18,checky:19,planks:21};
const ETCH_ID={scroll:1,bands:2,knot:3,chevron:4,diaper:5,runes:6};
const sgp=(c,e)=>Math.sign(c)*Math.pow(Math.abs(c),e);
function clothMat(color,pattern,color2,scale,proj=0,R=1.6){return M(null,false,color,{type:10,pat:pattern&&pattern!=='none'?{id:PAT_ID[pattern],scale,color:color2,proj,R}:null});}
// Indexed grid surface; fn(u,v,P) fills P. Seam normals are averaged when closedU.
function gridSurface(nu,nv,fn,closedU){const pos=[],idx=[],P=V3(0,0,0);
 for(let j=0;j<=nv;j++) for(let i=0;i<=nu;i++){fn(i/nu,j/nv,P); pos.push(P.x,P.y,P.z);}
 for(let j=0;j<nv;j++) for(let i=0;i<nu;i++){const a=j*(nu+1)+i,b=a+1,c=a+nu+1,d=c+1; idx.push(a,c,b,b,c,d);}
 const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
 if(closedU){const n=g.attributes.normal; for(let j=0;j<=nv;j++){const a=j*(nu+1), b=a+nu; const x=n.getX(a)+n.getX(b), y=n.getY(a)+n.getY(b), z=n.getZ(a)+n.getZ(b), l=Math.hypot(x,y,z)||1; n.setXYZ(a,x/l,y/l,z/l); n.setXYZ(b,x/l,y/l,z/l);}}
 return g;}
// Flip a part's winding so its first face points along `dir`.
function faceAlong(g,dir){const p=g.attributes.position, ix=g.index.array, A=V3(0,0,0),B=V3(0,0,0),C=V3(0,0,0); let s=0;
 for(let k=0;k<ix.length;k+=3){A.fromBufferAttribute(p,ix[k]);B.fromBufferAttribute(p,ix[k+1]);C.fromBufferAttribute(p,ix[k+2]); s+=C.clone().sub(B).cross(A.clone().sub(B)).dot(dir);}
 if(s<0){for(let k=0;k<ix.length;k+=3){const t=ix[k+1]; ix[k+1]=ix[k+2]; ix[k+2]=t;} g.index.needsUpdate=true; g.computeVertexNormals();}

// Faces of a tube around the Y axis should point away from the axis.
function outwardFromY(g){const p=g.attributes.position, ix=g.index.array, A=V3(0,0,0),B=V3(0,0,0),C=V3(0,0,0); let s=0;
 for(let k=0;k<ix.length;k+=3){A.fromBufferAttribute(p,ix[k]);B.fromBufferAttribute(p,ix[k+1]);C.fromBufferAttribute(p,ix[k+2]); const nrm=C.clone().sub(B).cross(A.clone().sub(B)); const ctr=A.clone().add(B).add(C); ctr.y=0; s+=nrm.dot(ctr);}
 if(s<0){for(let k=0;k<ix.length;k+=3){const t=ix[k+1]; ix[k+1]=ix[k+2]; ix[k+2]=t;} g.index.needsUpdate=true; g.computeVertexNormals();}

// ── Shared helpers for limbs
function outwardFrom(g,axisPt){const p=g.attributes.position, ix=g.index.array, A=V3(0,0,0),B=V3(0,0,0),C=V3(0,0,0); let s=0;

 if(s<0){for(let k=0;k<ix.length;k+=3){const t=ix[k+1]; ix[k+1]=ix[k+2]; ix[k+2]=t;} g.index.needsUpdate=true; g.computeVertexNormals();}

 // sole and heel

function fabricMat(kind,color,pattern,color2,scale){
 if(kind==='leather') return M(null,false,color,{type:4,pat:pattern&&pattern!=='none'?{id:PAT_ID[pattern],scale,color:color2}:null});
 if(kind==='burlap') return M(null,false,color,{type:10,pat:{id:3,scale:14,color:'#'+new THREE.Color(color).multiplyScalar(.82).getHexString()}});
 return clothMat(color,pattern,color2,scale);
}
// Rounded, bulging bag body around Y; bottom closes into a rounded base.
function bagSurface(W,H,D,bulge,n,top=1){return gridSurface(48,28,(u,v,P)=>{const th=u*Math.PI*2, y=H*top*v, kb=Math.sqrt(Math.max(0,1-Math.pow(1-Math.min(1,v/.14),2))), k=(1+bulge*Math.pow(Math.sin(Math.PI*Math.min(1,v*top)),.8))*kb;

// A flap draped from the back over the top and down the front.
function bagFlap(W,H,D,len,bulge){const path=new THREE.CatmullRomCurve3([V3(0,H*.98,-D/2*.85),V3(0,H+.1,-D*.2),V3(0,H+.1,D*.18),V3(0,H*.98,D/2*(1+bulge*.2)+.02),V3(0,H-len*.5,D/2*(1+bulge*.55)+.04),V3(0,H-len,D/2*(1+bulge*.7)+.05)],false,'centripetal'); const P2=V3(0,0,0);
 return gridSurface(20,30,(u,v,P)=>{path.getPointAt(v,P2); const tab=v>.82?Math.sqrt(Math.max(0,1-Math.pow((v-.82)/.18,2)))*.55+.45:1, w=W/2*1.05*(1+bulge*.4*Math.sin(Math.PI*Math.min(1,.55+v*.45)))*tab; P.set((u*2-1)*w,P2.y,P2.z);},false);}

// ───────────────────────── UI ─────────────────────────
const panel=document.getElementById('panel');
function fmt(p,v){switch(p.u){case 'cm':{const c=v*10;return (c<10?c.toFixed(1):c.toFixed(0))+' cm';}case 'mm':return (v*100).toFixed(1)+' mm';case 'deg':return Math.round(v)+'°';case 'x':return (+v).toFixed(2)+'×';case 'pct':return Math.round(v*100)+'%';case 'turn':return (v>0?'+':'')+(+v).toFixed(2)+' turn';case 'n':return String(Math.round(v));case 'd1':return (+v).toFixed(1);default:return (+v).toFixed(2);}}
function buildPanel(){
 panel.innerHTML='';
 SECTIONS.forEach((sec,si)=>{
  const d=document.createElement('details'); d.id='sec-'+sec.id; if(['head','spikes','flanges','prongs','gem'].includes(sec.id)&&si<6) d.open=false; if(sec.id==='head') d.open=true;
  const sum=document.createElement('summary');
  sum.innerHTML=`<span class="chev" aria-hidden="true"></span><span class="nm">${sec.name}</span>`;
  if(sec.id==='blade') d.open=true;
  if(sec.tog){const cb=document.createElement('input'); cb.type='checkbox'; cb.id=`${sec.id}-on`; cb.setAttribute('aria-label','Include '+sec.name);
   cb.addEventListener('click',e=>e.stopPropagation()); cb.addEventListener('change',()=>{S[sec.id].on=cb.checked; d.classList.toggle('off',!cb.checked); if(cb.checked) d.open=true; S.preset=null; syncPreset(); queue();}); sum.appendChild(cb);}
  d.appendChild(sum);
  const body=document.createElement('div'); body.className='body';
  sec.ps.forEach(p=>{
   if(p.t==='h'){const h=document.createElement('div');h.className='sub';h.textContent=p.l;body.appendChild(h);return;}
   const row=document.createElement('div'); row.className='row'; const id=`${sec.id}-${p.k}`;
   const lab=document.createElement('label'); lab.htmlFor=id; lab.textContent=p.l; row.appendChild(lab);
   let inp;
   if(p.t==='r'){const out=document.createElement('output'); out.id=id+'-v'; row.appendChild(out); inp=document.createElement('input'); inp.type='range'; inp.min=p.min; inp.max=p.max; inp.step=p.step;
    inp.addEventListener('input',()=>{S[sec.id][p.k]=parseFloat(inp.value); out.textContent=fmt(p,S[sec.id][p.k]); onEdit(sec.id,p.k);});}
   else if(p.t==='s'){inp=document.createElement('select'); p.opts.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;inp.appendChild(o);}); inp.addEventListener('change',()=>{S[sec.id][p.k]=inp.value; onEdit(sec.id,p.k);});}
   else if(p.t==='c'){inp=document.createElement('input'); inp.type='color'; inp.addEventListener('input',()=>{S[sec.id][p.k]=inp.value; onEdit(sec.id,p.k);});}
   else if(p.t==='b'){inp=document.createElement('input'); inp.type='checkbox'; inp.addEventListener('change',()=>{S[sec.id][p.k]=inp.checked; onEdit(sec.id,p.k);});}
   inp.id=id; row.appendChild(inp); body.appendChild(row);
  });
  d.appendChild(body); panel.appendChild(d);
 });
}
function syncPanel(){
 SECTIONS.forEach(sec=>{
  if(sec.tog){const cb=document.getElementById(`${sec.id}-on`); cb.checked=!!S[sec.id].on; document.getElementById('sec-'+sec.id).classList.toggle('off',!S[sec.id].on);}
  sec.ps.forEach(p=>{if(p.t==='h')return; const el=document.getElementById(`${sec.id}-${p.k}`); const v=S[sec.id][p.k];
   if(p.t==='r'){const [lo,hi]=rangeOf(sec.id,p); el.min=lo; el.max=hi; el.value=v; document.getElementById(`${sec.id}-${p.k}-v`).textContent=fmt(p,v);} else if(p.t==='b') el.checked=!!v; else el.value=v;});
 });
 document.getElementById('seed').value=S.seed;
 {const fs=document.getElementById('famsel'); if(fs) fs.value=S.family;}
 SECTIONS.forEach(sec=>{const d=document.getElementById('sec-'+sec.id); d.hidden=!vis(sec.id); d.querySelector('.nm').textContent=(sec.names&&sec.names[S.family])||sec.name;
  sec.ps.forEach(p=>{if(p.fam){const el=document.getElementById(`${sec.id}-${p.k}`); el.closest('.row').hidden=!p.fam.includes(S.family);}});});
 syncPreset();
}
const presetSel=document.getElementById('preset');
function fillPresets(){presetSel.innerHTML=''; const o0=document.createElement('option'); o0.value=''; o0.textContent='Custom'; presetSel.appendChild(o0);
 Object.keys(PRESETS[S.family]).forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;presetSel.appendChild(o);});}
function syncPreset(){presetSel.value=S.preset||'';}

let pending=false, refit=false;
function queue(fitAfter){ if(fitAfter) refit=true; if(pending) return; pending=true; requestAnimationFrame(()=>{pending=false; build(); updateLight(); if(refit){fit(); refit=false;} }); }
function onEdit(secId,k){
 if(secId==='render'){ updateLight();
  if(k==='pose'){applyPose(); fit(); return;}
  if(['bands','outline','metal','accent','wood','leather'].includes(k)) queue();
  return; }
 if(secId==='cond'){
  if(k==='state'){ if(COND_STATES[S.cond.state]) Object.assign(S.cond,COND_STATES[S.cond.state]); syncPanel(); }
  else { S.cond.state='custom'; document.getElementById('cond-state').value='custom'; }
  queue(); return; }
 if(S.preset){S.preset=null; syncPreset();}
 queue((secId==='shaft'&&k==='length')||(ARMOR[S.family]&&['length','size','style','shape','height','radius','width','sleeves'].includes(k)));
}

const OPEN_ON={bags:'bag',chests:'chest',food:'food',hands:'hand',feet:'boot',helm:'helm',garment:'garment',shield:'field',ring:'setting',amulet:'pendant',charm:'charm',staff:'head',mace:'head',sword:'blade',spear:'blade',dagger:'blade',bow:'limbs',crossbow:'stock'};
function setFamily(f){ S.family=f; fillPresets(); applyPreset(f,Object.keys(PRESETS[f])[0]); syncPanel(); const o=document.getElementById('sec-'+OPEN_ON[f]); if(o) o.open=true; queue(true); }
const famSel=document.getElementById('famsel'); FAM_GROUPS.forEach(([gl,fs])=>{const og=document.createElement('optgroup'); og.label=gl; fs.forEach(f=>{const o=document.createElement('option'); o.value=f; o.textContent=FAM_LABELS[f]; og.appendChild(o);}); famSel.appendChild(og);});
famSel.addEventListener('change',()=>setFamily(famSel.value));
presetSel.addEventListener('change',()=>{ if(!presetSel.value) return; applyPreset(S.family,presetSel.value); syncPanel(); queue(true); });
document.getElementById('seed').addEventListener('change',e=>{S.seed=Math.max(1,Math.min(999999,parseInt(e.target.value)||1)); queue();});
document.getElementById('reroll').addEventListener('click',()=>{S.seed=1+Math.floor(Math.random()*999998); randomize(); proportion(); syncPanel(); queue(true);});

// ───────────────────────── Loop ─────────────────────────
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock=new THREE.Clock();
function loop(){
 requestAnimationFrame(loop); const dt=clock.getDelta(), t=clock.elapsedTime;
 if(S.render.spin&&!reduce) pivot.rotation.y+=dt*.35;
 if(!reduce) gemBobbers.forEach(b=>{b.g.position.y=b.y+Math.sin(t*1.6)*b.s*.12; b.mesh.rotation.y+=dt*.5;});
 controls.update(); updateScale(); outlineMat.uniforms.w.value=S.render.outline*Math.min(2.2,Math.max(JEWEL[S.family]||S.family==='food'||S.family==='bags'?.02:.45,((cam.top-cam.bottom)/cam.zoom)/9)); pivot.updateMatrixWorld(); decayU.rootInv.value.copy(pivot.matrixWorld).invert(); renderer.render(scene,cam);
}
new ResizeObserver(()=>{resize();}).observe(stage);

buildPanel(); fillPresets(); applyPreset('mace','Pernach'); syncPanel();
resize(); build(); updateLight(); fit(); loop();
})();
</script>

</body></html>
