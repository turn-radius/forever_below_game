[package]
name = "armory"
description = "Spline Armory in Rust: item state (every slider) from a seed, and mesh data from a state. No Bevy dependency."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
procgen_rng = { workspace = true }
serde = { workspace = true }
# Field order is the order the state structs declare their sections and sliders in, which
# `reflect` lists them in.
serde_json = { workspace = true, features = ["preserve_order"] }
