# Builds Forever Below for Windows, macOS and Linux, each zipped with the `assets` folder beside
# the binary (the game loads its assets from there).
#
# - Pushing a tag like `v0.1.0` builds all three and attaches the zips to a GitHub release.
# - Running it by hand (Actions > Release > Run workflow) builds them and keeps the zips as
#   workflow artifacts, without publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            binary: forever_below.exe
          - os: macos-latest
            platform: macos
            binary: forever_below
          - os: ubuntu-latest
            platform: linux
            binary: forever_below
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Bevy's audio and input on Linux (https://bevy.org/learn/quick-start/getting-started/setup/).
      - name: Linux libraries
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # rust-toolchain.toml picks the toolchain; rustup installs it on first use.
      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p forever_below

      - name: Package
        shell: bash
        run: |
          name="forever-below-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          cp "target/release/${{ matrix.binary }}" "dist/$name/"
          cp -R game/assets "dist/$name/assets"
          cp README.md "dist/$name/"
          cd dist
          if [ "${{ matrix.platform }}" = "windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            zip -qr "$name.zip" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: forever-below-${{ matrix.platform }}
          path: dist/forever-below-${{ matrix.platform }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
