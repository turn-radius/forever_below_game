[package]
name = "forever_below"
description = "Forever Below: a first-person delve into an endless Stygian abyss."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["dev"]
# Saving a `.wesl` file reloads it in a running debug build. The shaders are embedded with
# `load_shader_library!`, which the file watcher does not see; `embedded_watcher` does. It watches
# the source files under `CARGO_MANIFEST_DIR`, so start the game with `cargo run -p forever_below`
# from the repository root (the binary run on its own watches nothing). Release builds pass
# `--no-default-features` and neither include nor run it (`main` also turns watching off
# without debug assertions).
dev = ["bevy/embedded_watcher"]
# Streams frame and system timings to the Tracy profiler (see "Profiling" in docs/rendering.md).
# Off by default, so ordinary builds do not compile tracy.
tracy = ["bevy/trace_tracy"]

[dependencies]
# `file_watcher` reloads `assets/tuning.toml` when it is saved; `main` turns watching on only
# in debug builds (`AssetPlugin::watch_for_changes_override`). `serialize` gives `KeyCode` serde,
# which `keybindings.toml` writes its keys with.
bevy = { workspace = true, features = ["file_watcher", "serialize"] }
armory = { workspace = true }
fb_items = { workspace = true }
fb_body = { workspace = true }
fb_level = { workspace = true }
fb_creatures = { workspace = true }
fb_character = { workspace = true }
procgen_rng = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# Saving the rules writes `data/rules.toml` with its comments kept.
toml_edit = "0.25"

[dev-dependencies]
# The timing checks read this thread's CPU time, which other work on the machine does not stretch.
libc = "0.2"
