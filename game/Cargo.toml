[package]
name = "forever_below"
description = "Forever Below: a first-person delve into an endless Stygian abyss."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# `file_watcher` reloads `assets/tuning.toml` when it is saved; `main` turns watching on only
# in debug builds (`AssetPlugin::watch_for_changes_override`). `serialize` gives `KeyCode` serde,
# which `keybindings.toml` writes its keys with.
bevy = { workspace = true, features = ["file_watcher", "serialize"] }
armory = { workspace = true }
fb_items = { workspace = true }
fb_body = { workspace = true }
fb_level = { workspace = true }
fb_creatures = { workspace = true }
fb_character = { workspace = true }
procgen_rng = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# Saving the rules writes `data/rules.toml` with its comments kept.
toml_edit = "0.25"

[dev-dependencies]
# The timing checks read this thread's CPU time, which other work on the machine does not stretch.
libc = "0.2"
